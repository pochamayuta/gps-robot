<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GPS to M5Stack Controller</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f0f0; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { 
            background: #007AFF; color: white; border: none; padding: 20px 40px; 
            font-size: 20px; border-radius: 50px; cursor: pointer; width: 100%;
            margin-bottom: 20px; transition: background 0.3s;
        }
        button:active { background: #0056b3; }
        #status { font-size: 14px; color: #666; margin-top: 10px; line-height: 1.6; }
        .data-box { background: #eee; padding: 10px; border-radius: 10px; margin-top: 10px; font-family: monospace; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Robot GPS Link</h2>
        <p>M5StackのWi-Fiに接続してから開始してください</p>
        
        <button onclick="startTracking()">Start Tracking</button>

        <div id="status">Waiting for interaction...</div>
        <div id="gps-data" class="data-box">---</div>
    </div>

    <script>
    let lastSentTime = 0;

    function startTracking() {
        if (!navigator.geolocation) {
            alert("お使いのブラウザはGPSをサポートしていません");
            return;
        }

        document.getElementById('status').innerText = "Tracking started. Position updates in real-time.";

        // 高精度な位置情報を継続的に取得
        navigator.geolocation.watchPosition(position => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const accuracy = position.coords.accuracy;

            // 画面表示を更新
            document.getElementById('gps-data').innerHTML = 
                `Lat: ${lat.toFixed(6)}<br>Lon: ${lon.toFixed(6)}<br>Acc: ±${Math.round(accuracy)}m`;

            // 通信頻
