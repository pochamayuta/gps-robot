<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GPS Link</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #fafafa; }
        button { background: #007AFF; color: white; border: none; padding: 20px; font-size: 1.2rem; border-radius: 12px; width: 100%; cursor: pointer; }
        #status { margin: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>GPS to Robot</h2>
    <button onclick="startTracking()">Start Tracking</button>
    <div id="status">Ready</div>
    <div id="data">---</div>

    <script>
    const M5_IP = "172.20.10.10"; // ★ここを今のIPに固定しました

    function startTracking() {
        if (!navigator.geolocation) {
            alert("GPS非対応です");
            return;
        }
        document.getElementById('status').innerText = "送信中...";

        navigator.geolocation.watchPosition(position => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            document.getElementById('data').innerText = `Lat: ${lat}\nLon: ${lon}`;

            const url = `http://${M5_IP}/gps?lat=${lat}&lon=${lon}`;
            
            // セキュリティ制限（Mixed Content）を回避するための no-cors
            fetch(url, { mode: 'no-cors' })
                .then(() => {
                    document.getElementById('status').innerText = "M5へ送信成功！";
                    document.getElementById('status').style.color = "green";
                })
                .catch(err => {
                    document.getElementById('status').innerText = "送信エラー";
                    document.getElementById('status').style.color = "red";
                });
        }, err => alert("GPS取得エラー"), { enableHighAccuracy: true });
    }
    </script>
</body>
</html>
